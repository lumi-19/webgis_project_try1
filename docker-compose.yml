version: "3.9"

services:
  # --- SPATIAL DATABASE ---
  postgis:
    image: postgis/postgis:15-3.3
    container_name: disasterscope_db
    environment:
      POSTGRES_USER: ${POSTGIS_USER}
      POSTGRES_PASSWORD: ${POSTGIS_PASSWORD}
      POSTGRES_DB: ${POSTGIS_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGIS_USER} -d ${POSTGIS_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ds_network

  # --- CACHING LAYER ---
  redis:
    image: redis:7-alpine
    container_name: disasterscope_redis
    ports:
      - "6379:6379"
    networks:
      - ds_network

  # --- GIS ENGINE ---
  geoserver:
    image: kartoza/geoserver:2.24.0
    container_name: disasterscope_geoserver
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      # Required to avoid permission issues in some Docker environments
      SKIP_GUESS_POSTGRES_VERSION: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/geoserver/web/"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - ds_network

  # --- FASTAPI BACKEND ---
  backend:
    build: ./backend
    container_name: disasterscope_backend
    environment:
      POSTGIS_USER: ${POSTGIS_USER}
      POSTGIS_PASSWORD: ${POSTGIS_PASSWORD}
      POSTGIS_DB: ${POSTGIS_DB}
      REDIS_URL: ${REDIS_URL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ds_network

  # --- REACT FRONTEND ---
  frontend:
    build: ./frontend
    container_name: disasterscope_frontend
    environment:
      REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
      REACT_APP_GEOSERVER_URL: ${REACT_APP_GEOSERVER_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ds_network

  # --- LOCAL AI ENGINE (Optional) ---
  ollama:
    image: ollama/ollama:latest
    container_name: disasterscope_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ds_network

networks:
  ds_network:
    driver: bridge

volumes:
  pgdata:
  ollama_data: