<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DisasterScope</title>

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-o9N1j7kGEXG4bq5sCk0JxQJ4YJvM1rYhYgP5pXr3y+0="
    crossorigin=""
  />

  <!-- App Styles -->
  <style>
    /* -----------------------------
       Global Reset
    ----------------------------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Ubuntu, sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #0b0f14;
      color: #ffffff;
      overflow: hidden;
    }

    /* -----------------------------
       Map Container
    ----------------------------- */
    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      animation: fadeIn 0.8s ease-in-out;
    }

    /* -----------------------------
       Header (Future controls)
    ----------------------------- */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 10px 18px;
      background: rgba(15, 20, 30, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 10px;
      font-size: 14px;
      letter-spacing: 0.5px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    /* -----------------------------
       Right Side Panel (Empty for now)
    ----------------------------- */
    .side-panel {
      position: absolute;
      top: 0;
      right: 0;
      width: 360px;
      height: 100%;
      background: rgba(10, 14, 20, 0.95);
      backdrop-filter: blur(10px);
      z-index: 1000;
      padding: 24px;
      display: none; /* activated later */
    }

    /* -----------------------------
       Animations
    ----------------------------- */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(1.01);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* -----------------------------
       Leaflet Overrides
    ----------------------------- */
    .leaflet-control-attribution {
      display: none;
    }

    .leaflet-control-zoom a {
      background: rgba(20, 25, 35, 0.9);
      color: #fff;
      border: none;
    }

    .leaflet-control-zoom a:hover {
      background: rgba(35, 45, 65, 0.9);
    }
  </style>
</head>

<body>
  <!-- Header -->
  <div class="top-bar">
    🌍 DisasterScope — Global Monitoring
  </div>

  <!-- Map -->
  <div id="map"></div>

  <!-- Side Panel (future use) -->
  <div class="side-panel" id="sidePanel"></div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-o8ljG3B7zG3EoJ2p+U0JdJfW6PzvK0pJp+5k5hQb+3I="
    crossorigin=""
  ></script>

  <!-- App Script -->
  <script>
    /* -----------------------------
       Map Initialization
    ----------------------------- */
    const map = L.map("map", {
      center: [20, 0],
      zoom: 2,
      minZoom: 2,
      zoomControl: true,
      worldCopyJump: true,
    });

    /* -----------------------------
       Dark Basemap
    ----------------------------- */
    L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
      {
        attribution: "&copy; OpenStreetMap & Carto",
        subdomains: "abcd",
        maxZoom: 19,
      }
    ).addTo(map);

    /* -----------------------------
       Placeholder Hooks (Future)
    ----------------------------- */
    // window.loadDisasters = function () {};
    // window.loadAirQuality = function () {};
  </script>
</body>
</html>
